plugins {
    id 'com.android.application'
}

android {
    namespace 'com.bcp.checkmkagent'
    compileSdk 35

    defaultConfig {
        applicationId 'com.bcp.checkmkagent'
        minSdk 26
        targetSdk 33          // Kembalikan ke 33 agar Foreground Service stabil di Android 14/16
        versionCode 7         // Naikkan versi ke 7
        versionName '1.3.3'
    }

    buildTypes {
        debug {
            applicationIdSuffix ''
            versionNameSuffix ''
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
